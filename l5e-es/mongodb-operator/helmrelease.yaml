apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mongodb-community-operator
  namespace: flux-system      # install operator in flux-system (or kube-system)
spec:
  interval: 5m
  chart:
    spec:
      chart: community-operator
      sourceRef:
        kind: HelmRepository
        name: mongodb-helm
        namespace: flux-system
      version: "0.13.0"          # latest chart version
      interval: 1h
  values: {}                    # use default values (no extra config needed)
