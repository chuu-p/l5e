apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: community-operator
  namespace: l5e
spec:
  interval: 5m
  chart:
    spec:
      chart: community-operator
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: l5e
      version: "0.9.0"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: community-operator
