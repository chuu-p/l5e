apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mongodb-community-operator
  namespace: mongodb
spec:
  interval: 5m
  chart:
    spec:
      chart: community-operator
      # You can pin a chart version here; leaving empty will follow repo latest.
      # version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb-charts
        namespace: flux-system
  # Optional: if you want to pass values to the chart you can add `values:` here.
  # The chart installs the operator into the HelmRelease namespace (mongodb).
