apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mongodb-operator
  namespace: l5e
spec:
  interval: 5m
  chart:
    spec:
      chart: community-operator
      sourceRef:
        kind: HelmRepository
        name: mongodb-community
        namespace: l5e
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: Create
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patchesStrategicMerge:
          - apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            metadata:
              name: mongodbcommunity.mongodbcommunity.mongodb.com
            spec:
              preserveUnknownFields: false
  values:
    operator:
      watchNamespace: l5e
    podSecurityPolicy:
      enabled: false
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 128Mi
