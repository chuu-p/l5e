apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mongodb-crds
  namespace: l5e
spec:
  chart:
    spec:
      chart: community-operator
      sourceRef:
        kind: HelmRepository
        name: mongodb-community
      version: "0.9.0"  # Specify version for stability
  interval: 15m
  install:
    crds: Create
  upgrade:
    crds: Create
  # This only installs CRDs, nothing else
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  non-existent: "true"
