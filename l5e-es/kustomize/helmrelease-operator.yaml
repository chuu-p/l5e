apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-community-operator
  namespace: mongodb
spec:
  interval: 10m
  chart:
    spec:
      chart: community-operator
      version: ">=0.9.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: flux-system
  install:
    createNamespace: false

