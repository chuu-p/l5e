apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-l5e-es
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-l5e-es-0
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: sc-l5e-es
  local:
    path: /run/media/at-1/l5e-es # Ensure this directory exists on 'toph'
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - toph
