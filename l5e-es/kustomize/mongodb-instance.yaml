apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: l5e-es
  namespace: l5e
spec:
  members: 1
  type: ReplicaSet
  version: "6.0.5"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: l5e-es-admin-credentials
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: l5e-es-scram
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: [ "ReadWriteOnce" ]
            storageClassName: "sc-l5e-es" # Links to our manual PV
            resources:
              requests:
                storage: 10Gi
