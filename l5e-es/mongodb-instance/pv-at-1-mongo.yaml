apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-at-1-mongo
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: sc-at-1-mongodb
  local:
    path: /run/media/at-1/mongo
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - toph

