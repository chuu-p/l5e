apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: l5e-es
  namespace: l5e
spec:
  members: 1

  type: ReplicaSet

  version: "6.0.14"   # <-- REQUIRED (or any supported version)

  security:
    authentication:
      modes: ["SCRAM"] # <- required

  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: l5e-es-admin-password
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: l5e-es-scram

  statefulSet:
    spec:
      template:
        spec:
          volumes:
            - name: data-volume
              persistentVolumeClaim:
                claimName: l5e-es-pvc

  additionalMongodConfig:
    storage.engine: wiredTiger
