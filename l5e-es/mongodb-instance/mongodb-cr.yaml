apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: l5e-es
  namespace: l5e
spec:
  members: 1
  type: ReplicaSet
  version: "6.0.14"

  security:
    authentication:
      modes: ["SCRAM"]

  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: l5e-es-admin-password
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: l5e-es-scram

  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 10Gi

        - metadata:
            name: logs-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: 2Gi

  additionalMongodConfig:
    storage.engine: wiredTiger
