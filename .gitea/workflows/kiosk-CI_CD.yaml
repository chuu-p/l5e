      # - name: scan for security vulnerabilities
      #   run: nix develop --command just audit
      #   working-directory: ./kiosk-site
      # - name: scan for outdated packages
      #   run: nix develop --command just outdated
      #   working-directory: ./kiosk-site

  build-and-deploy-site:
    name: Build and Deploy site
    runs-on: nixos-native
    if: startsWith(github.ref_name, 'site-')
    needs: CI - l5e-site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx for Insecure Registry
        uses: docker/setup-buildx-action@v3
        with:
