          buildkitd-config-inline: |
            [registry."registry.jinora.lan"]
            http = true
            insecure = true # Allows self-signed certs (useful if you switch back to HTTPS)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
