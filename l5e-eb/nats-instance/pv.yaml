apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-l5e-eb
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: sc-l5e-eb
  local:
    path: /run/media/at-1/eb # Ensure this folder exists on the node
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - toph
